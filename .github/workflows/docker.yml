name: Docker Build & Push

on:
  push:
    branches:
      - eviction
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - eviction
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Custom image tag (optional, e.g. latest, eviction, v1.0.0)'
        required: false
        default: ''
      channel:
        description: 'Release channel (e.g. eviction, dev, beta, stable)'
        required: false
        default: ''
      push:
        description: 'Push image to container registry'
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & Push Multi-Arch Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Version and Channel
        id: meta_version
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            VERSION="${{ inputs.tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            SHORT_SHA=$(git rev-parse --short HEAD)
            VERSION="${LATEST_TAG#v}-${SHORT_SHA}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          if [ -n "${{ inputs.channel }}" ]; then
            CHANNEL="${{ inputs.channel }}"
          elif [[ "$GITHUB_REF" == refs/tags/*-beta* ]]; then
            CHANNEL="beta"
          elif [[ "$GITHUB_REF" == refs/tags/*-rc* ]]; then
            CHANNEL="rc"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            CHANNEL="stable"
          elif [[ "$GITHUB_REF" == refs/heads/eviction ]]; then
            CHANNEL="eviction"
          elif [[ "$GITHUB_REF" == refs/heads/beta ]]; then
            CHANNEL="beta"
          else
            CHANNEL="dev"
          fi
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"

      - name: Determine image targets
        id: targets
        run: |
          IMAGES="ghcr.io/${{ github.repository }}"
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            HUB_REPO="${{ secrets.DOCKERHUB_IMAGE }}"
            if [ -z "$HUB_REPO" ]; then
              HUB_REPO="cy01/blackhole"
            fi
            IMAGES="${IMAGES}"$'\n'"docker.io/${HUB_REPO}"
            echo "has_hub=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_hub=false" >> "$GITHUB_OUTPUT"
          fi
          echo "images<<EOF" >> "$GITHUB_OUTPUT"
          echo "$IMAGES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' && (inputs.push == null || inputs.push) }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: ${{ steps.targets.outputs.has_hub == 'true' && github.event_name != 'pull_request' && (inputs.push == null || inputs.push) }}
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.targets.outputs.images }}
          flavor: |
            latest=auto
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && (inputs.push == null || inputs.push) }}
          build-args: |
            VERSION=${{ steps.meta_version.outputs.version }}
            CHANNEL=${{ steps.meta_version.outputs.channel }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
